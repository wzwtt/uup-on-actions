name: Watch new builds

# Periodically checks whether the monitored uupdump targets have a new full
# Windows build and triggers Build Windows ISO for each new one. Each queued
# target runs as its own job on its own runner, concurrently; a final job
# collects the outcomes once every build has finished.
# The monitoring configuration (daily time window and target list) is
# version-controlled on the `watch` orphan branch; each cycle fetches
# uup-watch.json from that branch (built-in defaults apply when the branch or
# the file is absent). Scheduled cycles only act inside the configured daily
# window; a manual dispatch acts immediately unless bypass_window is set to
# false, and plan_only reports what would be dispatched without building.

on:
  schedule:
    - cron: '0 */2 * * *'   # wake up every 2h; the script gates on the window
  workflow_dispatch:
    inputs:
      bypass_window:
        description: 'Ignore the daily activation window (manual runs default to true)'
        type: boolean
        required: false
        default: true
      plan_only:
        description: 'Resolve and report the targets without dispatching builds'
        type: boolean
        required: false
        default: false

permissions:
  contents: write   # required so the called build workflow can create releases

jobs:
  plan:
    name: Check for new builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      count: ${{ steps.watch.outputs.count }}
      matrix: ${{ steps.watch.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Fetch monitoring configuration
        shell: pwsh
        run: |
          git fetch --depth=1 origin watch
          if ($LASTEXITCODE -eq 0) {
            git show origin/watch:uup-watch.json > $env:RUNNER_TEMP/uup-watch.json
            if ($LASTEXITCODE -eq 0) {
              "WATCH_CONFIG=$env:RUNNER_TEMP/uup-watch.json" >> $env:GITHUB_ENV
            } else {
              Write-Warning 'uup-watch.json not found on the watch branch - built-in defaults apply'
            }
          } else {
            Write-Warning 'watch branch not found - built-in defaults apply'
          }

      - name: Watch
        id: watch
        shell: pwsh
        timeout-minutes: 15
        env:
          UUP_WATCH_FILE: ${{ env.WATCH_CONFIG }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_BYPASS: ${{ inputs.bypass_window }}
          UUP_PLAN_ONLY: ${{ inputs.plan_only }}
        run: |
          $bypass = if ($env:GITHUB_BYPASS -eq 'true' -or $env:GITHUB_BYPASS -eq 'True') { 'true' } else { 'false' }
          ./scripts/Watch-UupBuilds.ps1 -BypassWindow $bypass

  build:
    name: ${{ matrix.tag }}
    needs: plan
    if: needs.plan.outputs.count != '0' && needs.plan.outputs.count != '' && !inputs.plan_only
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    uses: ./.github/workflows/build-iso.yml
    with:
      build: ${{ matrix.build }}
      arch: ${{ matrix.arch }}
      language: ${{ matrix.language }}
      editions: ${{ matrix.editions }}
      virtual_editions: ${{ matrix.virtual_editions }}
      esd: ${{ matrix.esd == 'true' }}
      mirrors: ${{ matrix.mirrors }}
      options: ${{ matrix.options }}
      dry_run: false
      release_state: ${{ matrix.release_state }}
    permissions:
      contents: write

  summary:
    name: Summarise cycle
    needs: [plan, build]
    if: always() && needs.plan.outputs.count != '0' && needs.plan.outputs.count != '' && !inputs.plan_only
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Collect release outcomes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          UUP_MATRIX: ${{ needs.plan.outputs.matrix }}
        run: ./scripts/Summarise-UupCycle.ps1
